# Reusable: build a container in GHA (real BuildKit secrets, masked logs) ->
# push to GHCR -> scan (Trivy) -> SBOM (syft) -> sign (cosign, static key,
# NO transparency log: keyless would publish this private repo's name to
# public Rekor) -> `railway redeploy` -> poll the health surface until it
# reports build_rev == github.sha -> annotated tag deploy/<utc>-<sha7>.
#
# The last hop is the whole point (memory: a deploy is not a running process).
# ai-gm-gateway proved the pattern in its own build-image.yml (#72); this
# generalises it for stonetop-bot and tabletop-bots. Gateway keeps its bespoke
# workflow because of the ruleset-vendoring gate.
#
# ENGINE_REF is never passed as a build-arg here: the caller's Dockerfile
# `ARG ENGINE_REF=` is the sole pin (stonetop-bot 7e2a338).
name: build-image-railway

on:
  workflow_call:
    inputs:
      image:
        description: "e.g. ghcr.io/matthewdisabatino/stonetop-bot"
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: ""
      railway-service:
        description: "Railway service name to redeploy. Empty = build only."
        type: string
        default: ""
      deploy-branch:
        description: "Only redeploy when the ref is this branch."
        type: string
        default: "main"
      health-poll:
        description: "true = require HEALTH_URL and fail unless build_rev == sha within the window."
        type: boolean
        default: false
      trivy-severity:
        type: string
        default: "HIGH,CRITICAL"
    secrets:
      ENGINE_READ_TOKEN:
        required: false
      RAILWAY_TOKEN:
        required: false
      HEALTH_URL:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # deploy/ tag
      packages: write     # GHCR push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect optional secrets
        id: opt
        env:
          HAS_COSIGN: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        run: echo "cosign=$HAS_COSIGN" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            engine_token=${{ secrets.ENGINE_READ_TOKEN }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}
          trivyignores: .trivyignore

      - name: SBOM (syft, CycloneDX, run artifact)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.opt.outputs.cosign == 'true'

      - name: Sign image (static key, no tlog)
        if: steps.opt.outputs.cosign == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REF: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$REF"

      - name: Railway redeploy
        id: redeploy
        if: inputs.railway-service != '' && github.ref == format('refs/heads/{0}', inputs.deploy-branch)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ inputs.railway-service }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is unset - the image was pushed but NOT deployed. A skipped redeploy that logs 'skipping' is an outage (tabletop-bots, 2026-06-22..29)."
            exit 1
          fi
          npm install -g @railway/cli >/dev/null 2>&1
          railway redeploy --service "$SERVICE" --yes
          echo "fired=true" >> "$GITHUB_OUTPUT"

      - name: Assert the running build is THIS commit
        if: steps.redeploy.outputs.fired == 'true'
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          WANT: ${{ github.sha }}
          REQUIRE: ${{ inputs.health-poll }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::health-poll=true but HEALTH_URL secret is unset - refusing to call this a deploy."
              exit 1
            fi
            echo "::warning::HEALTH_URL unset - redeploy fired but the running build was NOT verified. Add a /health with build_rev (Phase 2)."
            exit 0
          fi
          for i in $(seq 1 40); do
            got="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build_rev",""))' 2>/dev/null || true)"
            if [ "$got" = "$WANT" ]; then echo "running build is $got"; exit 0; fi
            echo "attempt $i: build_rev=$got (want $WANT)"; sleep 15
          done
          echo "::error::timed out - the running build never reported $WANT"; exit 1

      - name: Tag the verified deploy
        if: steps.redeploy.outputs.fired == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          t="deploy/$(date -u +%Y%m%dT%H%M%SZ)-${SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$t" -m "verified deploy of $SHA" "$SHA"
          git push origin "$t"
          echo "tagged $t"
